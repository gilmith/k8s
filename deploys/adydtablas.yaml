apiVersion: apps/v1
kind: Deployment
metadata:
  name: adydtablas
  namespace: adyd
  labels:
    environment: desarrollo
    app: adydtablas
spec:  
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: adydtablas
  template:
    metadata:
      labels:
        app: adydtablas
    spec:
      containers:
      - name: adydtablas
        image: gilmith/adydtablas:0.0.5
        args: [ "java", "-jar", "adydtablas-0.0.5.jar", "--spring.config.location=file:/etc/config/application.yaml" ]
        ports:
        - containerPort: 10004
        volumeMounts:
          - name: config-volume
            mountPath: /etc/config
            readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: configadydtablas
